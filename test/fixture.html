<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo fixture</title>
<style>
  :root { --brand: #7c5cff; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #f6f7fb; color: #1d2030; }
  .hero { padding: 48px 32px; background: linear-gradient(135deg, var(--brand), #22d3ee); color: white; }
  .hero h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -0.02em; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px 32px; }
  .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
  .card.is-active { outline: 2px solid var(--brand); }
  @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
</style>
<script src="fixture.js"></script>
</head>
<body>
  <header class="hero" id="top" data-state="ready">
    <h1>Halo DevTools fixture</h1>
    <p>Content for the console, inspector, debugger and network panels.</p>
  </header>
  <main class="cards">
    <article class="card is-active" aria-label="First"><h2>Alpha</h2><p>Lorem ipsum dolor sit amet.</p></article>
    <article class="card"><h2>Beta</h2><p>Consectetur adipiscing elit.</p></article>
    <article class="card"><h2>Gamma</h2><p>Sed do eiusmod tempor.</p></article>
  </main>
</body>
</html>
